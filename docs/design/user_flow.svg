<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="740" viewBox="0 0 1300 740">
<title>HealthMate user flow</title>
<rect x="0" y="0" width="1300" height="740" fill="#FFFFFF"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3F4946"/></marker></defs>
<path d="M150 300 L150 102 L250 102" fill="none" stroke="#3F4946" stroke-width="2" marker-end="url(#ah)"/>
<text x="160" y="170" font-family="Roboto, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="500" fill="#161D1B">Add record (FAB)</text>
<path d="M520 300 L520 180 L370 180 L370 134" fill="none" stroke="#3F4946" stroke-width="2" marker-end="url(#ah)"/>
<text x="380" y="172" font-family="Roboto, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="500" fill="#161D1B">Add record (FAB)</text>
<path d="M240 332 L450 332" fill="none" stroke="#3F4946" stroke-width="2" marker-end="url(#ah)" marker-start="url(#ah)"/>
<text x="268" y="324" font-family="Roboto, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="500" fill="#161D1B">bottom navigation</text>
<path d="M630 332 L840 332" fill="none" stroke="#3F4946" stroke-width="2" marker-end="url(#ah)" marker-start="url(#ah)"/>
<text x="658" y="324" font-family="Roboto, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="500" fill="#161D1B">bottom navigation</text>
<path d="M580 300 L580 230 L730 230 L730 134" fill="none" stroke="#3F4946" stroke-width="2" marker-end="url(#ah)"/>
<text x="740" y="200" font-family="Roboto, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="500" fill="#161D1B">Pick date / Date range</text>
<path d="M820 102 L960 102 L960 62 L1040 62" fill="none" stroke="#3F4946" stroke-width="2" marker-end="url(#ah)"/>
<text x="885" y="52" font-family="Roboto, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="500" fill="#161D1B">has records</text>
<path d="M820 102 L960 102 L960 172 L1040 172" fill="none" stroke="#3F4946" stroke-width="2" marker-end="url(#ah)"/>
<text x="885" y="190" font-family="Roboto, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="500" fill="#161D1B">no records</text>
<path d="M1130 204 L1130 280 L610 280 L610 300" fill="none" stroke="#006A60" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#ah)"/>
<text x="1140" y="240" font-family="Roboto, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="500" fill="#006A60">Clear filter / ✕ chip</text>
<text x="1140" y="258" font-family="Roboto, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="500" fill="#006A60">→ back to full list</text>
<path d="M540 364 L540 530" fill="none" stroke="#3F4946" stroke-width="2" marker-end="url(#ah)"/>
<text x="552" y="470" font-family="Roboto, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="500" fill="#161D1B">Tap a record</text>
<path d="M630 562 L840 562" fill="none" stroke="#3F4946" stroke-width="2" marker-end="url(#ah)"/>
<text x="650" y="554" font-family="Roboto, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="500" fill="#161D1B">Delete icon</text>
<path d="M600 364 L600 440 L900 440 L900 530" fill="none" stroke="#3F4946" stroke-width="2" marker-end="url(#ah)"/>
<text x="760" y="432" font-family="Roboto, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="500" fill="#161D1B">Swipe left</text>
<path d="M930 594 L930 650 L80 650 L80 364" fill="none" stroke="#006A60" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#ah)"/>
<text x="100" y="640" font-family="Roboto, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="500" fill="#006A60">Delete → snackbar “Record deleted”; list and dashboard reload from SQLite</text>
<text x="1035" y="562" font-family="Roboto, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="500" fill="#161D1B">Cancel → record kept</text>
<path d="M300 134 L300 250 L480 250 L480 300" fill="none" stroke="#006A60" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#ah)"/>
<text x="306" y="268" font-family="Roboto, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="500" fill="#006A60">Save → “Record saved”, back to</text>
<text x="306" y="284" font-family="Roboto, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="500" fill="#006A60">previous tab (data refreshed)</text>
<path d="M450 562 L300 562 L300 420 L470 420 L470 364" fill="none" stroke="#006A60" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#ah)"/>
<text x="140" y="580" font-family="Roboto, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="500" fill="#006A60">Save changes → “Record updated”</text>
<text x="840" y="392" font-family="Roboto, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="500" fill="#006A60">Save goals → dashboard rings and goal line update</text>
<rect x="250" y="70" width="180" height="64" rx="12" fill="#FFFFFF" stroke="#6F7976" stroke-width="1.5"/>
<text x="340" y="98" font-family="Roboto, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="700" fill="#161D1B" text-anchor="middle">Add Record</text>
<text x="340" y="118" font-family="Roboto, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="400" fill="#3F4946" text-anchor="middle">validated form</text>
<rect x="640" y="70" width="180" height="64" rx="12" fill="#FFFFFF" stroke="#6F7976" stroke-width="1.5"/>
<text x="730" y="98" font-family="Roboto, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="700" fill="#161D1B" text-anchor="middle">Date picker</text>
<text x="730" y="118" font-family="Roboto, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="400" fill="#3F4946" text-anchor="middle">single date / range</text>
<rect x="1040" y="30" width="180" height="64" rx="12" fill="#FFFFFF" stroke="#6F7976" stroke-width="1.5"/>
<text x="1130" y="58" font-family="Roboto, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="700" fill="#161D1B" text-anchor="middle">Records – filtered</text>
<text x="1130" y="78" font-family="Roboto, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="400" fill="#3F4946" text-anchor="middle">matching records + chip</text>
<rect x="1040" y="140" width="180" height="64" rx="12" fill="#FFFFFF" stroke="#6F7976" stroke-width="1.5"/>
<text x="1130" y="168" font-family="Roboto, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="700" fill="#161D1B" text-anchor="middle">Records – empty</text>
<text x="1130" y="188" font-family="Roboto, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="400" fill="#3F4946" text-anchor="middle">“No records for this date”</text>
<rect x="60" y="300" width="180" height="64" rx="12" fill="#CCE8E2" stroke="#006A60" stroke-width="2"/>
<text x="150" y="328" font-family="Roboto, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="700" fill="#161D1B" text-anchor="middle">Dashboard</text>
<text x="150" y="348" font-family="Roboto, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="400" fill="#3F4946" text-anchor="middle">today + goals + chart</text>
<rect x="450" y="300" width="180" height="64" rx="12" fill="#CCE8E2" stroke="#006A60" stroke-width="2"/>
<text x="540" y="328" font-family="Roboto, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="700" fill="#161D1B" text-anchor="middle">Health Records</text>
<text x="540" y="348" font-family="Roboto, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="400" fill="#3F4946" text-anchor="middle">list, newest first</text>
<rect x="840" y="300" width="180" height="64" rx="12" fill="#CCE8E2" stroke="#006A60" stroke-width="2"/>
<text x="930" y="328" font-family="Roboto, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="700" fill="#161D1B" text-anchor="middle">Goals</text>
<text x="930" y="348" font-family="Roboto, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="400" fill="#3F4946" text-anchor="middle">daily targets</text>
<rect x="450" y="530" width="180" height="64" rx="12" fill="#FFFFFF" stroke="#6F7976" stroke-width="1.5"/>
<text x="540" y="558" font-family="Roboto, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="700" fill="#161D1B" text-anchor="middle">Edit Record</text>
<text x="540" y="578" font-family="Roboto, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="400" fill="#3F4946" text-anchor="middle">pre-filled form</text>
<rect x="840" y="530" width="180" height="64" rx="12" fill="#FFFFFF" stroke="#6F7976" stroke-width="1.5"/>
<text x="930" y="558" font-family="Roboto, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="700" fill="#161D1B" text-anchor="middle">Delete record?</text>
<text x="930" y="578" font-family="Roboto, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="400" fill="#3F4946" text-anchor="middle">confirmation dialog</text>
<text x="60" y="715" font-family="Roboto, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="400" fill="#3F4946">Solid arrows: user actions.  Dashed arrows: where the app returns after saving or deleting.  Teal boxes: the three bottom-navigation tabs.</text>
</svg>
